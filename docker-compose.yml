services:
  llm_service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: app_server
    depends_on:
      qdrant:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ollama_embedding:
        condition: service_healthy
      valkey:
        condition: service_healthy
    user: "1000:1000"
    volumes:
      - ./:/app:z
      - jikinge_logs:/app/logs
    restart: unless-stopped
    secrets:
      - postgres_secrets
      - whatsapp_secrets
      - whatsapp_token
    env_file:
      - .env
    networks:
      - jikinge_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "uvicorn"
      - "main:app"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8000"
      - "--log-level"
      - "info"
      - "--reload" # Remove in production
    ports:
      - "8000:8000"

  valkey:
    image: valkey/valkey:8.1-alpine
    container_name: valkey_server
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - jikinge_valkey_data:/data
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - jikinge_network

  qdrant:
    image: qdrant/qdrant:latest
    restart: always
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    expose:
      - 6333
      - 6334
      - 6335
    volumes:
      - jikinge_qdrant_data:/qdrant/storage
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "timeout 10 bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1",
        ]
      interval: 30s
      timeout: 15s
      retries: 15
      start_period: 180s
    networks:
      - jikinge_network

  postgres:
    image: docker.io/library/postgres:17.5-alpine
    container_name: db_server
    ports:
      - "5432:5432"
    volumes:
      - jikinge_postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    environment:
      - POSTGRES_DB=jikinge_db
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD_FILE=/run/secrets/postgres_secrets
    secrets:
      - postgres_secrets
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jikinge_db"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - jikinge_network

  ollama_embedding:
    image: ollama/ollama:latest
    container_name: embedding_server
    ports:
      - "11434:11434"
    volumes:
      - jikinge_embeddings_data:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list | grep -q nomic-embed-text || exit 1"]
      interval: 30s
      timeout: 20s
      retries: 10
      start_period: 120s
    entrypoint: >
      sh -c "
        ollama serve &
        sleep 30 &&
        ollama pull nomic-embed-text &&
        wait
      "
    networks:
      - jikinge_network

       - jikinge_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      # --- KRaft Specific Settings ---
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Generates a unique cluster ID automatically
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

      # --- Listener Settings ---
      # CONTROLLER (9093): Internal KRaft communication
      # PLAINTEXT (9092): For your Python App (llm_service)
      # EXTERNAL (29092): For your host machine (laptop tools)
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"

      # --- Optimization & Topic Settings ---
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      # In KRaft, we check the broker port
      test: ["CMD-SHELL", "nc -z localhost 9092 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - jikinge_network
    restart: unless-stopped
networks:
  jikinge_network:
    driver: bridge

volumes:
  jikinge_embeddings_data:
  jikinge_qdrant_data:
  jikinge_postgres_data:
  jikinge_logs:
  jikinge_graph_data:
  jikinge_valkey_data:

